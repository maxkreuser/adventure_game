<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Adventure Game</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div id="game-container">
            <h1>Your Adventure Game</h1>
            <div id="text-container">
                <p id="text">Your adventure begins now...</p>
            </div>
            <button id="next-btn" /*onclick="nextText()"*/>Next</button>
            <div id="answers-btn-container">
                <button id="answer-btn-1" /*onclick="answerQuestion()"*/>Answer 1</button>
                <button id="answer-btn-2" /*onclick="answerQuestion()"*/>Answer 2</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
